# INVENTORY — which machines, and how to reach them.
# Ansible needs this because, unlike Terraform, it does not create the machines.
# It connects to ones that already exist.

[web]
web-a ansible_host=10.0.128.20
web-b ansible_host=10.0.192.20

[db]
db-primary ansible_host=10.0.128.50

# A group of groups.
[app:children]
web
db

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/cloudprep.pem
# Everything above runs over SSH, port 22. If the security group blocks 22,
# nothing here works — no agent is listening on the far side.
